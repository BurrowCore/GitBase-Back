
spring:
  application:
    name: GitBase-Backend
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema (db/migration). Hibernate never changes it — it only checks at startup
      # that the entities match, and refuses to start if a migration is missing.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases created by the old ddl-auto=update already hold the V1 schema: mark them as
    # version 1 instead of running V1, then apply V2+. Empty databases run everything from V1.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    # Refuse to start against a database migrated by a newer GitBase (Flyway ignores that by default).
    ignore-migration-patterns: "*:missing"
    clean-disabled: true
server:
  port: 8880
